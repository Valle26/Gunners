<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gunners Kabine</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0f11">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with four tabs (Spieler, Spiel, Training, TV); phone-first lists and lineup slots; the TV tab renders a fixed 1920x1080 stage scaled to fit. Single black/yellow Gunners look, same as the Shot Map. */
:root{
  --bg:#0e0f11; --surface:#17181b; --surface-2:#212226; --line:#2d2e33;
  --fg:#f1efe8; --muted:#a09e96; --accent:#f5c518; --on-accent:#141208;
  --danger:#ef5b5f; --ok:#34c77b; --stage:#0a0b0d;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:1}
option{background:var(--surface);color:var(--fg)}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:34px;width:auto}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--surface-2);color:var(--fg)}
.tab.tv[aria-current="true"]{background:var(--accent);color:var(--on-accent)}

main{max-width:1040px;margin:0 auto;padding-block:16px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
h2{font-family:var(--display);font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--display);font-size:18px;margin:0;font-weight:600;letter-spacing:.02em}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.chip{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.chip.ex{border:1px dashed var(--muted);background:transparent}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:7px;color:var(--muted);font-weight:500;min-width:40px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.seg.acc button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper b{font-family:var(--display);font-size:20px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;line-height:1}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:12px;color:var(--muted)}
.field .seg{display:flex;flex-wrap:nowrap}
.field .seg button{flex:1;padding:7px 6px}
.field textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px;resize:vertical;line-height:1.45}
.field input,.field select{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{min-width:0}
/* iOS: Datum und Uhrzeit nicht breiter als das Feld, Text links wie bei den anderen Feldern */
.field input[type=date],.field input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:44px;line-height:1.4;text-align:left}
.field input::-webkit-date-and-time-value{text-align:left;margin:0}
@media (max-width:600px){.fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fields>.wide{grid-column:1/-1}.fields .seg{width:100%}.fields .seg button{flex:1}}

/* Fotos */
.ph{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.ini{display:grid;place-items:center;width:100%;height:100%;background:var(--surface-2);color:var(--muted);font-family:var(--display);font-weight:700;letter-spacing:.04em}

/* Spielerliste */
.plist{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px}
.pbtn{width:52px;height:65px;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--surface-2);position:relative;flex:none}
.pbtn .ini{font-size:18px}
.pbtn .cam{position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.pbtn .cam svg{width:11px;height:11px}
.prow.target .pbtn{outline:2px dashed var(--accent);outline-offset:2px}
.pname{min-width:0}
.pname b{display:block;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.pname small{color:var(--muted);font-size:12px}
.posseg button{min-width:30px;padding:6px 7px;font-family:var(--display);font-weight:700;letter-spacing:.04em}
.icon{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.icon svg{width:16px;height:16px}
.tray{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tray button{flex:none;width:64px;height:80px;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface-2)}
.tray button[aria-pressed="true"]{border-color:var(--accent)}

/* Lineup */
.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.line.pair{grid-template-columns:34px repeat(2,minmax(0,1fr))}
.lnum{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
.lnum small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px 8px;display:grid;justify-items:center;gap:5px;min-width:0;text-align:center}
.slot:hover{background:var(--surface-2)}
.slot .sp{width:60px;height:75px;border-radius:8px;overflow:hidden}
.slot .sp .ini{font-size:16px}
.slot .sl{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.slot .sn{font-size:13px;line-height:1.2;font-weight:500;width:100%;overflow-wrap:anywhere}
.slot .sn small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.slot.empty{border-style:dashed;background:transparent}
.slot.empty .sp{display:grid;place-items:center;border:1px dashed var(--line);color:var(--muted);font-size:22px}
.secthead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench span{font-size:13px;background:var(--surface-2);border-radius:999px;padding:3px 10px;color:var(--muted)}

/* Training */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grp{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.grp-h{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 4px;}
.grp-c{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border:0;border-radius:8px;background:transparent;color:inherit;text-align:left;font:inherit;letter-spacing:inherit;text-transform:inherit}
.grp-c:hover{background:rgba(0,0,0,.12)}
.grp-mv{display:flex;gap:4px;flex:none}
.grp-mv button{width:32px;height:32px;border-radius:8px;border:0;background:rgba(0,0,0,.16);color:inherit;display:grid;place-items:center;padding:0}
.grp-mv svg{width:14px;height:14px}
@media (max-width:519px){.grp-mv svg{transform:rotate(90deg)}}
.grp-x{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.grp-b{display:grid;gap:6px;padding:10px}
.mini{display:flex;align-items:center;gap:8px;border:0;background:var(--surface-2);border-radius:9px;padding:4px 8px 4px 4px;text-align:left;min-width:0;width:100%}
.mini .mp{width:32px;height:40px;border-radius:6px;overflow:hidden;flex:none}
.mini .mp .ini{font-size:12px}
.mini span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mini i{font-style:normal;margin-left:auto;font-family:var(--display);font-weight:700;font-size:12px;color:var(--muted)}

/* TV */
.tvctl{display:grid;gap:14px}
.tvstat{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.dotlive{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px rgba(52,199,123,.18)}
.dotlive.pin{background:var(--accent);box-shadow:0 0 0 4px rgba(245,197,24,.18)}
.checks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.check{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.check i{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.check[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] i::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg)}
.check small{flex-basis:100%;padding-left:30px;color:var(--muted);font-size:12px}
.tvfoot{position:absolute;left:72px;right:72px;bottom:22px;display:flex;align-items:center;gap:22px}
.tvdots{display:flex;gap:10px}
.tvdots i{width:14px;height:14px;border-radius:50%;background:#33343a}
.tvdots i.on{background:var(--accent)}
.tvbar{flex:1;height:5px;border-radius:3px;background:#1e1f23;overflow:hidden}
.tvbar b{display:block;height:100%;width:100%;background:rgba(245,197,24,.55);transform-origin:0 50%;animation:prog linear forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stage.fade{animation:fadein .6s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stage.fade{animation:none}.tvbar b{animation:none}}
.stagewrap{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
.stagewrap:fullscreen{border:0;border-radius:0;background:#000}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--stage);color:var(--fg);overflow:hidden;padding:52px 72px 56px;display:flex;flex-direction:column;gap:26px}
.stage .ring{position:absolute;right:-260px;top:-260px;width:820px;height:820px;border-radius:50%;border:10px solid rgba(245,197,24,.05);pointer-events:none}
.stage .ring.b{right:-120px;top:-120px;width:540px;height:540px;border-width:4px}
.tvh{position:relative;display:flex;align-items:center;gap:34px;flex:none}
.tvh img{height:128px;width:auto}
.tvh .e{font-family:var(--display);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-size:30px;line-height:1}
.tvh .t{font-family:var(--display);font-weight:700;font-size:86px;line-height:.95;text-transform:uppercase;margin-top:6px;white-space:nowrap}
.tvh .t em{font-style:normal;color:var(--accent);padding-inline:.18em;font-size:.6em;vertical-align:.2em}
.tvh .m{color:var(--muted);font-size:28px;margin-top:6px}
.tvh .r{margin-left:auto;text-align:right;font-family:var(--display);font-weight:700;color:var(--muted);font-size:26px;letter-spacing:.08em;text-transform:uppercase;align-self:flex-start}
.tvb{position:relative;flex:1;min-height:0;display:grid;gap:44px}
.tvcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.tvcol h4{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1}
.tvrows{display:grid;gap:18px;align-content:start}
.tvrow{display:grid;gap:16px;height:var(--h);align-items:stretch}
.tvn{font-family:var(--display);font-weight:700;color:var(--accent);font-size:calc(var(--h) * .42);line-height:1;display:grid;place-items:center}
.tvn.g{font-size:calc(var(--h) * .3)}
.pc{display:flex;background:#16171a;border:1px solid #26272c;border-radius:16px;overflow:hidden;min-width:0;height:100%}
.pc .pp{width:var(--p);height:100%;flex:none;background:#202126}
.pc .pp .ini{font-size:calc(var(--p) * .3)}
.pc .pt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 18px 0 20px;gap:4px}
.pc .pos{font-family:var(--display);font-weight:700;color:var(--accent);letter-spacing:.12em;font-size:calc(var(--h) * .12);line-height:1}
.pc .ln{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:calc(var(--h) * .2);line-height:1;white-space:nowrap}
.pc .fn{color:#b5b3ab;font-size:calc(var(--h) * .13);line-height:1.1;white-space:nowrap}
.pc.empty{background:transparent;border:2px dashed #2a2b30}
.pc.empty .pp{background:transparent}
.pc.dim{opacity:.72}
.tvgroups{position:relative;flex:1;min-height:0;display:grid;gap:26px;align-items:start}
.tg{display:flex;flex-direction:column;gap:14px;min-width:0}
.tg-h{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.08em;text-transform:uppercase}
.tg-h small{font-size:26px;opacity:.75;letter-spacing:.04em}
.tg-b{display:grid;gap:12px}
.tc{display:flex;align-items:center;gap:min(16px,calc(var(--tw,600px) * .035));background:#16171a;border:1px solid #26272c;border-radius:12px;overflow:hidden;height:var(--th);min-width:0}
.tc .pp{width:min(calc(var(--th) * .8),calc(var(--tw,600px) * .24));height:100%;flex:none;background:#202126}
.tc .pp .ini{font-size:calc(var(--th) * .26)}
.tc .tt{min-width:0;padding-right:min(14px,calc(var(--tw,600px) * .03))}
.tc .tnr{flex:none;width:1.25em;text-align:center;font-family:var(--display);font-weight:700;color:var(--accent);font-size:min(calc(var(--th) * .4),calc(var(--tw,600px) * .13));line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-left:calc(min(var(--th),var(--tw,600px) * .3) * -.06)}
.tc .ln{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:min(calc(var(--th) * .3),calc(var(--tw,600px) * .1));line-height:1;white-space:nowrap}
.tc .fn{color:#b5b3ab;font-size:min(calc(var(--th) * .19),calc(var(--tw,600px) * .065));white-space:nowrap;margin-top:2px}
.tvempty{color:#6e6c66;font-size:30px;padding:20px 4px}

/* Sheet */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pick{display:grid;gap:6px}
.pick .mini{padding:6px 10px 6px 6px}
.pick .mini .mp{width:40px;height:50px}
.pick .mini[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.pick .mini em{font-style:normal;margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.pick .sub{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.crop{position:relative;width:min(300px,78vw);aspect-ratio:4/5;max-width:100%;margin:0 auto;border-radius:12px;overflow:hidden;touch-action:none;cursor:grab;background:#000}
.crop canvas{display:block;width:100%;height:100%}
.crop::after{content:"";position:absolute;left:22%;right:22%;top:12%;height:52%;border:2px dashed rgba(255,255,255,.35);border-radius:50%;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.brow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.brow .bt{width:52px;height:65px;border-radius:8px;overflow:hidden}
.brow small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:56px;height:56px;border-radius:12px;border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:12px}
.swatches button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center}
/* Archiv, Goalies, Leerzustand */
.linkbtn{border:0;background:transparent;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.linkbtn:hover{color:var(--fg)}
.chip.tv{background:var(--accent);color:var(--on-accent)}
.chip.game{background:rgba(215,38,61,.2);color:#f39aa5}
.chip.tr{background:rgba(31,95,209,.25);color:#9dbbf2}
.empty{display:grid;gap:10px;justify-items:start;padding:22px}
.alist{display:grid;gap:6px}
.alist h3{margin-bottom:2px}

.umbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}

function smooth(pts){

  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`}

function slotGet(k){const g=SG();if(!g)return null;if(k==='g1')return g.g1;if(k==='g2')return g.g2;const[t,i,f]=k.split('.');return (g[ARR[t]]||[])[+i]?.[f]||null}
function rawSet(k,id){const g=SG();if(k==='g1')g.g1=id;else if(k==='g2')g.g2=id;else{const[t,i,f]=k.split('.');g[ARR[t]][+i][f]=id}}
function slotKeys(f){const g=SG(),a=[];if(!g)return a;
  const add=t=>(g[ARR[t]]||[]).forEach((u,i)=>FIELDS[t].forEach(x=>a.push(`${t}.${i}.${x}`)));
  if(!f||f==='ev'){add('L');add('P');a.push('g1','g2')}
  if(!f||f==='pp')add('PP');
  if(!f||f==='pk')add('PK');
  return a}

function smoothPath(p){
  if(!p.length)return'';if(p.length<3)return'M'+p.map(q=>q[0]+' '+q[1]).join(' L');
  let d=`M${p[0][0]} ${p[0][1]}`;
  for(let i=1;i<p.length-1;i++){const mx=((p[i][0]+p[i+1][0])/2).toFixed(1),my=((p[i][1]+p[i+1][1])/2).toFixed(1);d+=` Q${p[i][0]} ${p[i][1]} ${mx} ${my}`}
  const l=p[p.length-1];return d+` L${l[0]} ${l[1]}`;
}
function arrowHead(p,c,w){
  if(p.length<2)return'';const e=p[p.length-1];let k=p.length-2;
  while(k>0&&Math.hypot(e[0]-p[k][0],e[1]-p[k][1])<3)k--;
  const s=p[k],a=Math.atan2(e[1]-s[1],e[0]-s[0]),L=2.4+w*1.4,W=1.3+w*.8;
  const q=(d,o)=>[(e[0]-Math.cos(a)*d+Math.cos(a+Math.PI/2)*o).toFixed(1),(e[1]-Math.sin(a)*d+Math.sin(a+Math.PI/2)*o).toFixed(1)];
  const [x1,y1]=q(L,W),[x2,y2]=q(L,-W);
  return `<path d="M${e[0]} ${e[1]}L${x1} ${y1}L${x2} ${y2}Z" fill="${c}"/>`;
}
function strokeSVG(s){
  const w=BW[s.w||2];
  if(s.t==='m'){const {x,y,c}=s;
    if(s.m==='X')return `<circle cx="${x}" cy="${y}" r="3.4" fill="${c}"/><text x="${x}" y="${y+1.6}" font-size="4.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#fff" text-anchor="middle">X</text>`;
    if(s.m==='O')return `<circle cx="${x}" cy="${y}" r="3.3" fill="#fff" stroke="${c}" stroke-width="1.2"/><text x="${x}" y="${y+1.6}" font-size="4.3" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="${c}" text-anchor="middle">O</text>`;
    if(s.m==='G')return `<circle cx="${x}" cy="${y}" r="3.4" fill="#f5c518" stroke="#15181d" stroke-width=".7"/><text x="${x}" y="${y+1.6}" font-size="4.3" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#15181d" text-anchor="middle">G</text>`;
    return `<ellipse cx="${x}" cy="${y}" rx="1.6" ry="1.15" fill="#15181d"/>`;
  }
  const d=smoothPath(s.pts),dash=s.t==='pass'?` stroke-dasharray="${(w*2.6).toFixed(1)} ${(w*2).toFixed(1)}"`:'';
  return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`+(s.t==='arrow'||s.t==='pass'?arrowHead(s.pts,s.c,w):'');
}

const isBoardOnTV=b=>{const c=tvc();return pinActive()&&c.pin==='b:'+b.id};
function bindBoard(){
  const svg=$('#bsvg');if(!svg)return;const b=BD(U.board);if(!b)return;
  const strokes=svg.querySelector('.bstrokes'),temp=svg.querySelector('.btemp');
  let cur=null,pid=null,penSeen=false;
  const pt=e=>{const m=svg.getScreenCTM().inverse(),q=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return [+q.x.toFixed(1),+q.y.toFixed(1)]};
  const redraw=()=>{strokes.innerHTML=b.strokes.map(strokeSVG).join('');temp.innerHTML=''};
  const commit=()=>{b.date=today();save();redraw();const u=$('[data-act=bundo]'),cl=$('[data-act=bclear]');if(u)u.disabled=!b.strokes.length;if(cl)cl.disabled=!b.strokes.length};
  svg.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen')penSeen=true;
    if(penSeen&&e.pointerType==='touch')return;
    if(cur)return;
    e.preventDefault();const p=pt(e),t=U.btool||'pen',c=U.bcol||BCOLS[0][0];
    if(t==='erase'){let best=-1,bd=4;b.strokes.forEach((s,i)=>{const ps=s.t==='m'?[[s.x,s.y]]:s.pts;ps.forEach(q=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<=bd){bd=d;best=i}})});if(best>=0){b.strokes.splice(best,1);commit()}cur={t:'erase'};pid=e.pointerId;svg.setPointerCapture(pid);return}
    if(['X','O','G','puck'].includes(t)){b.strokes.push({t:'m',m:t,c,x:p[0],y:p[1]});commit();return}
    cur={t,c,w:U.bw||2,pts:[p]};pid=e.pointerId;svg.setPointerCapture(pid);temp.innerHTML=strokeSVG(cur);
  });
  svg.addEventListener('pointermove',e=>{
    if(!cur||e.pointerId!==pid)return;e.preventDefault();const p=pt(e);
    if(cur.t==='erase'){let hit=-1;b.strokes.forEach((s,i)=>{const ps=s.t==='m'?[[s.x,s.y]]:s.pts;if(ps.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<=3))hit=i});if(hit>=0){b.strokes.splice(hit,1);redraw()}return}
    const l=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<.5)return;
    cur.pts.push(p);temp.innerHTML=strokeSVG(cur);
  });
  const end=e=>{
    if(!cur||e.pointerId!==pid)return;
    if(cur.t==='erase'){cur=null;commit();return}
    const s=cur;cur=null;
    if(s.pts.length===1)s.pts.push([s.pts[0][0]+.3,s.pts[0][1]]);
    b.strokes.push(s);commit();
  };
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}

let pendingPush=false,ME=null,ROLE=null,MEMBERS=[],pushT=null,pushing=false,dirty=false,pendingRender=false,chan=null;
const UIKEY=KEY+'-real-ui'+(TEAM==='km'?'':'-'+TEAM);
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify({curGame:S.curGame,curTraining:S.curTraining,tray:S.tray}))}catch(e){}}
function loadUI(){try{const u=JSON.parse(localStorage.getItem(UIKEY));if(u){S.curGame=u.curGame||null;S.curTraining=u.curTraining||null;S.tray=Array.isArray(u.tray)?u.tray:[]}}catch(e){}}
const canEdit=()=>ROLE==='admin'||ROLE==='trainer';
function setSync(st){const el=$('#syncst');if(!el)return;el.className='sync '+st;el.textContent=st==='ok'?'Gespeichert':st==='wait'?'Speichert …':st==='err'?'Nicht gespeichert':st==='off'?'Offline':'Nur ansehen'}
function restoreFromSynced(){const rows=[...synced].map(([key,j])=>({key,data:JSON.parse(j)}));loadDocs(rows);render()}
function save(){
  saveUI();
  if(!sb||!ROLE)return;
  if(!canEdit()){toast('Du kannst nur ansehen. Änderungen werden nicht gespeichert.');restoreFromSynced();return}
  clearTimeout(pushT);setSync('wait');pendingPush=true;pushT=setTimeout(push,350);
}
async function push(){
  if(pushing){dirty=true;return}
  pushing=true;pendingPush=false;
  try{
    const m=docsOf(S),ups=[],dels=[];
    for(const [k,v] of m){const j=stable(v);if(synced.get(k)!==j)ups.push({key:k,kind:k.slice(0,k.indexOf(':')),data:JSON.parse(j)})}
    const row=u=>({key:dbKey(u.key),team:TEAM,kind:u.kind,data:u.data});
    for(const k of synced.keys())if(!m.has(k))dels.push(k);
    for(let i=0;i<ups.length;i+=200){const part=ups.slice(i,i+200);const {error}=await sb.from('kb_docs').upsert(part.map(row));if(error)throw error;part.forEach(u=>synced.set(u.key,stable(u.data)))}
    if(dels.length){const {error}=await sb.from('kb_docs').delete().in('key',dels.map(dbKey));if(error)throw error;dels.forEach(k=>synced.delete(k))}
    setSync('ok');
  }catch(e){setSync('err');toast('Speichern hat nicht geklappt. Ich versuche es gleich nochmal.');setTimeout(()=>{dirty=false;push()},5000)}
  finally{pushing=false;if(dirty){dirty=false;push()}}
}
function scheduleRender(){
  const busy=!$('#ovl').hidden||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$('#main').contains(document.activeElement));
  if(busy){pendingRender=true;return}
  pendingRender=false;render();
}

function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('kb-app').on('postgres_changes',{event:'*',schema:'public',table:'kb_docs'},pl=>onDocChange(pl,scheduleRender));
  chan=chan.on('postgres_changes',{event:'*',schema:'public',table:'g_access'},pl=>{const r=pl.new&&pl.new.user_id?pl.new:pl.old;
    if(r&&r.user_id===ME.id){if(pl.eventType==='DELETE'||mapRole(pl.new)!==ROLE){location.reload();return}}
    if(ROLE==='admin')loadMembers().then(()=>{badge();if(U.tab==='settings')scheduleRender()})});
  chan.subscribe(st=>{if(st==='SUBSCRIBED'){setSync(canEdit()?'ok':'view')}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')setSync('off')});
}

const PUBPATH='/storage/v1/object/public/kabine/';
async function upload(dataURL,prefix){
  const blob=await (await fetch(dataURL)).blob();
  const path=`${prefix}/${uid()}${uid()}.jpg`;
  const {error}=await sb.storage.from('kabine').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
  if(error)throw error;
  return sb.storage.from('kabine').getPublicUrl(path).data.publicUrl;
}
function removeFile(url){const m=url&&String(url).split(PUBPATH)[1];if(m)sb.storage.from('kabine').remove([decodeURIComponent(m)]).catch(()=>{})}
async function setPhoto(p,dataURL,quiet){

function gate(kind,msg){
  const g=$('#gate');g.hidden=false;document.documentElement.classList.add('gated');

  const H={
    setup:`${logo}<h2>Noch nicht verbunden</h2><p class="muted">Die Anmeldung konnte nicht geladen werden. Prüfe die Verbindung und lade die Seite neu.</p>`,
    err:`${logo}<h2>Keine Verbindung</h2><p class="muted">${esc(msg||'Die Daten konnten nicht geladen werden.')}</p><button class="btn primary" data-act="gRetry">Nochmal versuchen</button><a class="linkbtn" href="${HOME}">Zur Startseite</a>`,

async function afterLogin(user){
  ME={id:user.id,email:user.email,name:(user.user_metadata&&user.user_metadata.name)||''};
  gate('load');
  const {data:acc,error}=await sb.from('g_access').select('*').eq('user_id',user.id).maybeSingle();
  if(error){gate('err',loginMsg(error));return}
  const r=mapRole(acc);
  if(r==='tv'){location.replace('../tv/'+(teamQ()?'?'+teamQ():''));return}
  if(!r){toHome(acc&&acc.status==='ok'?'kein':'zu');return}
  if(!(await loadTeamName())){gate('err','Diese Mannschaft gibt es nicht (mehr). Wähle sie auf der Startseite neu aus.');return}
  showTeam();
  ROLE=r;ME.name=acc.name||ME.name;
  try{
    const rows=await fetchDocs();
    S=emptyS();loadUI();loadDocs(rows);
    if(TEAM==='km'){if(!rows.length&&ROLE==='admin'){seedReal();normalize();await push()}}
    // Neue Mannschaft: Standard-Übungen und Einstellungen ergänzen, auch wenn Spieler schon per SQL eingetragen wurden
    else if(!rows.some(r=>r.key==='meta:tv')&&canEdit()){if(!S.drills.length)S.drills=stdDrills();normalize();await push()}
  }catch(e){gate('err',loginMsg(e));return}
  await loadMembers();subscribe();ungate();setSync(canEdit()?'ok':'view');render();
  loadExt().then(ch=>{if(ch)scheduleRender()});
}
async function boot(){
  if(!configured()||!window.supabase){gate('setup');return}
  // Gemeinsamer Login für alle Gunners Apps (gleicher Speicherplatz wie Startseite, Kasse und Shot Map)
  try{const dk='sb-'+new URL(CFG.url).hostname.split('.')[0]+'-auth-token',old=localStorage.getItem('gunners-kabine-auth');if(old&&!localStorage.getItem(dk))localStorage.setItem(dk,old);localStorage.removeItem('gunners-kabine-auth')}catch(e){}
  sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession();
  if(!data.session){toHome('zu');return}
  afterLogin(data.session.user);
}

async function importCode(d){
  const x=migrate(d);let n=0,fail=0;
  const total=x.players.filter(p=>p.photo&&p.photo.startsWith('data:')).length+x.drills.filter(q=>q.photo&&q.photo.startsWith('data:')).length;
  for(const p of x.players){if(p.photo&&p.photo.startsWith('data:')){toast(`Fotos werden hochgeladen … ${++n}/${total}`);try{p.photo=await upload(p.photo,'spieler')}catch(e){p.photo=null;fail++}}}
  for(const q of x.drills){if(q.photo&&q.photo.startsWith('data:')){toast(`Fotos werden hochgeladen … ${++n}/${total}`);try{q.photo=await upload(q.photo,'uebungen')}catch(e){q.photo=null;fail++}}}
  const games=x.games.filter(g=>!g.example),trs=x.trainings.filter(t=>!t.example);
  Object.assign(S,{players:x.players,games,trainings:trs,drills:x.drills,boards:x.boards||[],cats:x.cats||CATS.slice(),tvc:x.tvc||TVC0()});
  S.curGame=null;S.curTraining=null;normalize();save();
  return fail;
}

function slidesFor(e){
  if(!e)return boardSlides();const c=tvc(),out=[];
  if(e.k==='game'){const g=e.x;
    if(c.gs.lines!==false)out.push({k:'lines',n:'Linien'});
    if(c.gs.pp!==false&&g.pp.length)out.push({k:'pp',n:'Powerplay'});
    if(c.gs.pk!==false&&g.pk.length)out.push({k:'pk',n:'Unterzahl'});
    const smg=smFor(g);if(c.gs.shotmap!==false&&smg)out.push({k:'shotmap',n:smg.status==='live'?'Shot Map (live)':'Shot Map'});
    if(!out.length)out.push({k:'lines',n:'Linien'});
  }else{const t=e.x;
    if(c.ts.groups!==false)out.push({k:'groups',n:'Gruppen'});
    if(c.ts.drills!==false)t.drills.forEach((id,i)=>{const d=DR(id);if(d)out.push({k:'d'+i,n:`Übung ${i+1}: ${d.name}`,drill:true})});
    out.push(...kasseSlides());
    if(!out.length)out.push({k:'groups',n:'Gruppen'});
  }
  return out.concat(boardSlides());
}

  if(!sl.length)return null;

        const [y,mo]=m.split('-').map(Number);m=mo===12?(y+1)+'-01':y+'-'+String(mo+1).padStart(2,'0')}})});

function layoutStage(e,s){
  const st=$('#stage');if(!st)return;

    const g=e.x,R=1.25+0.4;let cw;
    if(s.k==='lines'){
      const nB=Math.max(g.lines.length,g.pairs.length,1),bw=(1776-(nB-1)*30)/nB;
      const cwW=(bw-2*12)/3,cwH=(avail-34*2-12*3-20)/(3*R);
      cw=Math.min(cwW,cwH,230);
    }else if(s.k==='pp'){
      const n=Math.max(1,g.pp.length),rh=Math.min(avail-48,((1776-(n-1)*140)/n)*80/85);
      st.style.setProperty('--rh',Math.floor(rh)+'px');cw=rh*.172;

function fitStage(){

  if(fs){w.style.height='';st.style.left=(W-1920*s)/2+'px';st.style.top=(innerHeight-1080*s)/2+'px'}
  else{w.style.height=1080*s+'px';st.style.left='0';st.style.top='0'}

function pickerList(k){

  const placed=p=>{const s=slotOf(p.id,f);return !!s&&s!==k};
  let ps=sorted().filter(p=>!q||(p.first+' '+p.last).toLowerCase().includes(q));
  const hidden=ps.filter(p=>p.id!==cur&&placed(p)).length;
  if(!sheetCtx.all)ps=ps.filter(p=>p.id===cur||!placed(p));
  const curP=ps.find(p=>p.id===cur);ps=ps.filter(p=>p.id!==cur);
  const label=want==='G'?'Goalies':want==='F'?'Stürmer und D/F':'Verteidiger und D/F';
  const grp=[['Aktuell auf diesem Platz',curP?[curP]:[]],[label,ps.filter(fits)],['Ohne Position',ps.filter(p=>!p.pos)],['Andere Positionen',ps.filter(p=>p.pos&&!fits(p))]];

/* ---------- Fotos ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
function fileImg(f){const u=URL.createObjectURL(f);return loadImg(u)}
function cropTo(im,sx,sy,sw,sh){const c=document.createElement('canvas');c.width=OW;c.height=OH;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,sx,sy,sw,sh,0,0,OW,OH);return c.toDataURL('image/jpeg',.84)}
function autoCrop(im){const iw=im.naturalWidth,ih=im.naturalHeight,ar=OW/OH;let sw=iw,sh=ih;if(iw/ih>ar)sw=ih*ar;else sh=iw/ar;return cropTo(im,(iw-sw)/2,(ih-sh)*.2,sw,sh)}
function scaleImg(im,max){const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}
function openCrop(im,pid){
  openSheet(head('Ausschnitt wählen','Bild verschieben, mit dem Regler zoomen. Das Gesicht in den Kreis.')+
  `<div class="crop" id="crop"><canvas id="cropc" width="600" height="750"></canvas></div>
  <label class="field"><span>Zoom</span><input type="range" id="cropz" min="1" max="3" step="0.01" value="1"></label>
  <div class="btns" style="justify-content:flex-end"><button class="btn" data-act="close">Abbrechen</button><button class="btn primary" data-act="cropOk">Übernehmen</button></div>`,{pid});
  const cv=$('#cropc'),x=cv.getContext('2d'),W=cv.width,H=cv.height,iw=im.naturalWidth,ih=im.naturalHeight;
  const base=Math.max(W/iw,H/ih);
  const st={z:1,cx:iw/2,cy:Math.min(ih/2,ih*.2+(H/base)/2)};
  function box(){const s=base*st.z,sw=W/s,sh=H/s;st.cx=Math.max(sw/2,Math.min(iw-sw/2,st.cx));st.cy=Math.max(sh/2,Math.min(ih-sh/2,st.cy));return[st.cx-sw/2,st.cy-sh/2,sw,sh]}
  function draw(){const b=box();x.clearRect(0,0,W,H);x.drawImage(im,...b,0,0,W,H)}
  draw();
  $('#cropz').addEventListener('input',e=>{st.z=+e.target.value;draw()});
  let drag=null;const el=$('#crop');
  el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!drag)return;const k=(W/el.clientWidth)/(base*st.z);st.cx-=(e.clientX-drag.x)*k;st.cy-=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};draw()});
  el.addEventListener('pointerup',()=>drag=null);el.addEventListener('pointercancel',()=>drag=null);
  el.addEventListener('wheel',e=>{e.preventDefault();st.z=Math.max(1,Math.min(3,st.z-e.deltaY*.002));$('#cropz').value=st.z;draw()},{passive:false});
  sheetCtx.done=()=>cropTo(im,...box());
}

const norm=s=>s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'');
const plain=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const toks=s=>s.split(/[^a-z0-9]+/).filter(Boolean);
function match(fname){
  const base=fname.replace(/\.[^.]+$/,'');
  const T=new Set([...toks(norm(base)),...toks(plain(base))]);
  let best=null,bs=0,tie=false;
  for(const p of S.players){
    const L=[toks(norm(p.last)),toks(plain(p.last))],F=[toks(norm(p.first)),toks(plain(p.first))];
    let sc=0;
    if(L.some(l=>l.length&&l.every(x=>T.has(x))))sc+=2;
    if(F.some(f=>f.some(x=>T.has(x))))sc+=1;
    if(sc<2)continue;
    if(sc>bs){best=p;bs=sc;tie=false}else if(sc===bs)tie=true;
  }
  return best&&!tie?best:null;
}
$('#fileMany').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;

  for(const f of files){try{const im=await fileImg(f);const m=match(f.name);const pid=m&&!taken.has(m.id)?m.id:null;if(pid)taken.add(pid);items.push({id:uid(),name:f.name,src:autoCrop(im),pid,on:!!pid})}catch(err){}}

function mixTraining(t,ids){
  t.groups.forEach(g=>g.ids=[]);const by={D:[],F:[],'':[]};
  shuffle(ids.filter(id=>P(id)&&!isGK(id))).forEach(id=>{const q=P(id).pos;by[q==='H'?'D':(q||'')].push(id)});
  let i=0;['D','F',''].forEach(k=>by[k].forEach(id=>{t.groups[i%t.groups.length].ids.push(id);i++}));
}

    S.trainings.push(t);S.curTraining=t.id;U.ttab='gruppen';save();closeSheet();go('training',U.tab==='archiv'?'archiv':'start');toast('Training angelegt');
  },
  open(b){if(b.dataset.k==='game'){S.curGame=b.dataset.id;U.gtab='linien';save();go('spiel',U.tab)}else{S.curTraining=b.dataset.id;U.ttab='gruppen';save();go('training',U.tab)}},
  delGame(){
    if(U.arm!=='delGame'){U.arm='delGame';render();return}
    const id=S.curGame;S.games=S.games.filter(g=>g.id!==id);if(S.tvc.ev&&S.tvc.ev.id===id)S.tvc.ev=null;
    S.curGame=null;U.arm=null;save();go(U.from||'start');toast('Spiel gelöscht');
  },
  delTraining(){
    if(U.arm!=='delTraining'){U.arm='delTraining';render();return}
    const id=S.curTraining;S.trainings=S.trainings.filter(t=>t.id!==id);if(S.tvc.ev&&S.tvc.ev.id===id)S.tvc.ev=null;
    S.curTraining=null;U.arm=null;save();go(U.from||'start');toast('Training gelöscht');
  },

  gtab(b){U.gtab=b.dataset.v;render()},
  slot(b){openPicker(b.dataset.k)},
  pickSlot(b){slotSet(sheetCtx.k,b.dataset.id||null);save();closeSheet();render()},
  home(b){CG().home=b.dataset.v==='1';save();render()},
  lines(b){const g=CG();if(+b.dataset.v>0)g.lines.push(LINE());else g.lines.pop();g.example=false;save();render()},
  pairs(b){const g=CG();if(+b.dataset.v>0)g.pairs.push(PAIR());else g.pairs.pop();g.example=false;save();render()},
  ppn(b){const g=CG();if(+b.dataset.v>0)g.pp.push(PPU());else g.pp.pop();save();render()},
  pkn(b){const g=CG();if(+b.dataset.v>0)g.pk.push(PKU());else g.pk.pop();save();render()},
  ppFill(){
    const g=CG(),L=g.lines,Pr=g.pairs;
    g.pp.forEach((u,i)=>{const l=L[i]||{},a=Pr[i]||{};Object.assign(u,{pt:a.ld||null,hl:a.rd||null,hr:l.rw||null,sl:l.c||null,nf:l.lw||null})});
    g.pk.forEach((u,i)=>{const l=L[L.length-1-i]||{},a=Pr[Pr.length-1-i]||{};Object.assign(u,{f1:l.c||null,f2:l.lw||null,d1:a.ld||null,d2:a.rd||null})});
    withGame(g,()=>{['pp','pk'].forEach(f=>{const seen=new Set();slotKeys(f).forEach(k=>{const id=slotGet(k);if(id&&seen.has(id))rawSet(k,null);else if(id)seen.add(id)})})});
    save();render();toast('Vorschlag aus den Linien eingetragen');
  },
  clearGame(){if(U.arm!=='clearGame'){U.arm='clearGame';render();return}U.arm=null;slotKeys('ev').forEach(k=>rawSet(k,null));CG().example=false;save();render();toast('Linien geleert')},
  pin(b){const c=tvc();c.mode='pin';c.pin=b.dataset.v;c.at=Date.now();save();render()},
  toShow(){const c=tvc();c.mode='show';c.smScope='all';slideIdx=0;save();render()},
  smGo(){const e=tvEvent();if(!e||e.k!=='game')return;S.curGame=e.x.id;U.gtab='linien';go('spiel','tv');setTimeout(()=>{const el=$('.smlink');if(el){el.scrollIntoView({block:'center'});const sl=el.querySelector('select');if(sl)sl.focus()}},50)},
  smShow(b){const c=tvc();c.smScope=b.dataset.v;c.mode='pin';c.pin='shotmap';c.at=Date.now();save();render()},
  slideTog(b){const c=tvc(),g=b.dataset.g,k=b.dataset.v;if(!c[g])c[g]={};c[g][k]=c[g][k]===false;slideIdx=0;save();render()},
  dx2(){const c=tvc();c.dx2=!c.dx2;save();render()},
  tvPickOpen:openTvPick,
  tvPick(b){const c=tvc();c.ev={k:b.dataset.k,id:b.dataset.id};c.mode='show';slideIdx=0;save();closeSheet();render()},
  tvAuto(){const c=tvc();c.ev=null;c.mode='show';slideIdx=0;save();closeSheet();render()},
  sec(b){tvc().sec=+b.dataset.v;save();render()},
  back(b){const c=tvc();c.back=+b.dataset.v;if(c.mode==='pin')c.at=Date.now();save();render()},
  fs(){const w=$('#stagewrap');if(!w)return;const r=w.requestFullscreen||w.webkitRequestFullscreen;if(r){try{const x=r.call(w);if(x&&x.catch)x.catch(()=>toast('Vollbild ist hier nicht verfügbar.'))}catch(e){toast('Vollbild ist hier nicht verfügbar.')}}else toast('Vollbild ist hier nicht verfügbar.')},

  ttab(b){U.ttab=b.dataset.v;render()},
  groups(b){const t=CT();if(+b.dataset.v>0){const free=GORDER.find(c=>!t.groups.some(g=>g.col===c))||'gelb';t.groups.push({col:free,ids:[]})}else t.groups.pop();t.example=false;save();render()},
  shuffle(){
    const t=CT();let ids=t.groups.flatMap(g=>g.ids);if(!ids.filter(id=>!isGK(id)).length)ids=S.players.map(p=>p.id);
    mixTraining(t,ids);t.example=false;save();render();toast('Neu gemischt');
  },
  gcolor(b){const gi=+b.dataset.i,t=CT(),g=t.groups[gi];openSheet(head(`Gruppe ${GCOL[g.col].n}`,'Farbe wählen und Platz festlegen. Eine Farbe, die schon vergeben ist, wird getauscht.')+`<div class="field"><span>Farbe</span><div class="swatches">${GORDER.map(c=>`<button data-act="gcolOk" data-v="${c}" aria-pressed="${g.col===c}" style="background:${GCOL[c].c};color:${GCOL[c].t}">${GCOL[c].n}</button>`).join('')}</div></div>`+(t.groups.length>1?`<div class="field"><span>Platz in der Reihenfolge</span><div class="seg acc">${t.groups.map((x,i)=>`<button data-act="gpos" data-v="${i}" aria-pressed="${i===gi}">${i+1}.</button>`).join('')}</div></div>`:'')+`<button class="btn primary" data-act="close">Fertig</button>`,{gi})},
  gpos(b){const t=CT(),from=sheetCtx.gi,to=+b.dataset.v;const[g]=t.groups.splice(from,1);t.groups.splice(to,0,g);sheetCtx.gi=to;save();render();A.gcolor({dataset:{i:to}})},
  gmove(b){const t=CT(),i=+b.dataset.i,j=i+ +b.dataset.v;if(j<0||j>=t.groups.length)return;[t.groups[i],t.groups[j]]=[t.groups[j],t.groups[i]];save();render()},
  gcolOk(b){const t=CT(),g=t.groups[sheetCtx.gi],nc=b.dataset.v,o=t.groups.find(x=>x!==g&&x.col===nc);if(o)o.col=g.col;g.col=nc;save();render();A.gcolor({dataset:{i:sheetCtx.gi}})},
  tplayer(b){openTPlayer(b.dataset.id)},
  trole(b){const t=CT(),id=sheetCtx.id;if(!t.roles)t.roles={};t.roles[id]=b.dataset.v;t.example=false;save();render();openTPlayer(id)},
  tmove(b){const t=CT(),id=sheetCtx.id;t.groups.forEach(g=>g.ids=g.ids.filter(x=>x!==id));const gi=+b.dataset.g;if(gi>=0)t.groups[gi].ids.push(id);t.example=false;save();closeSheet();render()},
  gadd(b){const gi=+b.dataset.i;openSheet(head(`Gruppe ${GCOL[CT().groups[gi].col].n}`,'Goalies hakst du im Reiter Goalies ab.')+`<div class="pick" id="gaddl"></div><button class="btn primary" data-act="close">Fertig</button>`,{gi});gaddRender()},
  gaddR(b){const t=CT(),g=t.groups[sheetCtx.gi],id=b.dataset.id;t.groups.forEach(o=>o.ids=o.ids.filter(x=>x!==id));g.ids.push(id);if(!t.roles)t.roles={};t.roles[id]=b.dataset.v;t.example=false;save();gaddRender();render()},
  gtog(b){const t=CT(),g=t.groups[sheetCtx.gi],id=b.dataset.id;if(g.ids.includes(id))g.ids=g.ids.filter(x=>x!==id);else{t.groups.forEach(o=>o.ids=o.ids.filter(x=>x!==id));g.ids.push(id)}t.example=false;save();gaddRender();render()},
  gktog(b){const t=CT(),id=b.dataset.id;t.gks=t.gks.includes(id)?t.gks.filter(x=>x!==id):t.gks.concat(id);save();render()},
  gkall(b){const t=CT();t.gks=b.dataset.v==='1'?S.players.filter(p=>p.pos==='G').map(p=>p.id):[];save();render()},

  cats(){U.arm=null;openCats()},
  catAdd(){const v=$('#cat-new').value.trim();if(!v)return;if(S.cats.includes(v)){toast('Diese Kategorie gibt es schon.');return}S.cats.push(v);save();openCats();render();toast('Kategorie angelegt')},
  catMove(b){const i=+b.dataset.i,j=i+ +b.dataset.v;if(j<0)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save();openCats();render()},
  catDel(b){const i=+b.dataset.i;if(U.arm!=='cat'+i){U.arm='cat'+i;openCats();return}U.arm=null;const c=S.cats[i];S.cats.splice(i,1);
    if(S.drills.some(d=>d.cat===c)){if(!S.cats.includes('Sonstiges'))S.cats.push('Sonstiges');S.drills.forEach(d=>{if(d.cat===c)d.cat='Sonstiges'})}
    if(U.dcat===c)U.dcat='all';save();openCats();render();toast(`„${c}“ gelöscht`)},
  uok(b){const u=USERS().find(x=>x.id===b.dataset.id),sel=$('#wr-'+u.id);u.role=sel?sel.value:u.role;u.status='ok';save();render();toast(`${u.name.replace('Beispiel: ','')} ist freigeschaltet als ${ROLES[u.role]}`)},
  uno(b){S.users=USERS().filter(x=>x.id!==b.dataset.id);save();render();toast('Anfrage abgelehnt')},
  urole(b){const u=USERS().find(x=>x.id===b.dataset.id);if(u.me)return;u.role=b.dataset.v;save();render()},
  uoff(b){const id=b.dataset.id;if(U.arm!=='off'+id){U.arm='off'+id;render();return}U.arm=null;USERS().find(x=>x.id===id).status='off';save();render();toast('Zugang gesperrt')},
  uon(b){USERS().find(x=>x.id===b.dataset.id).status='ok';save();render();toast('Wieder freigeschaltet')},
  tvpw(){const pw=Array.from({length:3},()=>Math.random().toString(36).slice(2,6)).join('-');openSheet(head('Neues TV-Passwort','In der echten Version wird damit der alte Zugang sofort ungültig.')+`<div class="pwbox">${pw}</div><div class="small muted">Am Mini-PC einmal abmelden und mit diesem Passwort neu anmelden. Vorschau: hier wird nichts wirklich geändert.</div><button class="btn primary" data-act="close">Fertig</button>`)},
  bkOut(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const kb=Math.round(code.length/1024);openSheet(head('Sicherungscode',`${kb} KB · Fotos sind enthalten, deshalb kann der Code lang sein.`)+`<textarea id="bk-out" class="bkta" readonly>${code}</textarea><div class="btns" style="justify-content:flex-end"><button class="btn primary" data-act="bkCopy">Kopieren</button></div>`)},
  bkCopy(){const t=$('#bk-out');const ok=()=>toast('Code kopiert');const fb=()=>{t.focus();t.select();toast('Code markiert. Jetzt kopieren.')};try{navigator.clipboard.writeText(t.value).then(ok,fb)}catch(e){fb()}},
  bkIn(){openSheet(head('Wiederherstellen','Sicherungscode einfügen. Achtung: Die aktuellen Daten werden ersetzt.')+`<textarea id="bk-in" class="bkta" placeholder="Code hier einfügen"></textarea><div class="btns" style="justify-content:flex-end"><button class="btn" data-act="close">Abbrechen</button><button class="btn primary" data-act="bkDo">Wiederherstellen</button></div>`)},
  bkDo(b){const v=$('#bk-in').value.trim();let d;try{d=JSON.parse(decodeURIComponent(escape(atob(v))))}catch(e){toast('Der Code ist ungültig oder unvollständig.');return}if(!d||!Array.isArray(d.players)){toast('Der Code enthält keine Kabinen-Daten.');return}
    if(!b.classList.contains('armed')){b.classList.add('armed','danger');b.textContent='Wirklich ersetzen?';return}
    S=migrate(d);save();closeSheet();go('start');toast('Daten wiederhergestellt')},
  addDrills:openAddDrills,
  dtog(b){const t=CT(),id=b.dataset.id;t.drills=t.drills.includes(id)?t.drills.filter(x=>x!==id):t.drills.concat(id);save();dpickRender();render()},
  dmove(b){const t=CT(),i=+b.dataset.i,j=i+ +b.dataset.v;if(j<0||j>=t.drills.length)return;[t.drills[i],t.drills[j]]=[t.drills[j],t.drills[i]];save();render()},
  drm(b){const t=CT();t.drills.splice(+b.dataset.i,1);save();render()},
  viewDrill(b){openViewDrill(b.dataset.id)},
  newDrill(){openDrill(null)},
  editDrill(b){openDrill(b.dataset.id)},
  drillPhoto(){$('#fileDrill').click()},
  drillRmPhoto(){sheetCtx.photo=null;$('#d-pic').innerHTML=dpic({photo:null,diag:sheetCtx.diag});$('#d-rmwrap').innerHTML=''},
  async saveDrill(){
    const name=$('#d-name').value.trim();if(!name){toast('Bitte einen Namen eintragen.');return}
    let cat=$('#d-cat').value;
    if(!canEdit()){toast('Du kannst nur ansehen.');return}
    let ph=sheetCtx.photo||null;const old=sheetCtx.id&&DR(sheetCtx.id)?DR(sheetCtx.id).photo:null;
    if(ph&&ph.startsWith('data:')){try{toast('Foto wird hochgeladen …');ph=await upload(ph,'uebungen')}catch(e){toast('Das Foto konnte nicht hochgeladen werden.');return}}
    if(old&&old!==ph)removeFile(old);
    const v={name,cat,min:Math.max(1,Math.min(120,parseInt($('#d-min').value,10)||10)),desc:$('#d-desc').value.trim(),photo:ph};
    const fromPlan=U.tab==='training'&&!sheetCtx.id;
    if(sheetCtx.id)Object.assign(DR(sheetCtx.id),v);
    else{const d=Object.assign({id:'d'+uid(),diag:null},v);S.drills.push(d);if(fromPlan&&CT())CT().drills.push(d.id)}
    save();closeSheet();render();toast(fromPlan?'Übung angelegt und zum Plan hinzugefügt':'Übung gespeichert');
  },
  delDrill(b){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Wirklich löschen?';return}
    const id=sheetCtx.id;removeFile((DR(id)||{}).photo);S.drills=S.drills.filter(d=>d.id!==id);S.trainings.forEach(t=>t.drills=t.drills.filter(x=>x!==id));
    save();closeSheet();render();toast('Übung gelöscht');
  }
};
function openTPlayer(id){
  const t=CT(),p=P(id),cur=groupOf(id),r=trRole(t,id);
  openSheet(head(full(p),cur?`Gerade in Gruppe ${GCOL[cur.col].n}`:'Nicht eingeteilt')+
  `<div class="field"><span>Spielt in diesem Training als</span><div class="seg acc rolesel">${ROLES3.map(k=>`<button data-act="trole" data-v="${k}" aria-pressed="${r===k}">${k==='H'?'D/F (Hybrid)':POSK[k]}</button>`).join('')}</div>${p.pos&&p.pos!=='G'?`<small class="muted small">Normale Position: ${POS[p.pos]}</small>`:''}</div>
  <div class="field"><span>Gruppe</span><div class="swatches">${t.groups.map((g,gi)=>`<button data-act="tmove" data-g="${gi}" aria-pressed="${g===cur}" style="background:${GCOL[g.col].c};color:${GCOL[g.col].t}">${GCOL[g.col].n}</button>`).join('')}</div></div>
  <div class="btns" style="justify-content:space-between">${cur?`<button class="btn" data-act="tmove" data-g="-1">Nicht dabei</button>`:'<span></span>'}<button class="btn primary" data-act="close">Fertig</button></div>`,{id});
}
function gaddRender(){const t=CT(),g=t.groups[sheetCtx.gi],all=sorted().filter(p=>p.pos!=='G');
  const inThis=all.filter(p=>g.ids.includes(p.id)),free=all.filter(p=>!groupOf(p.id)),other=all.filter(p=>{const o=groupOf(p.id);return o&&o!==g});
  const row=p=>{const o=groupOf(p.id),d=trRole(t,p.id);return `<div class="mini rrow"><span class="mp">${photo(p)}</span><span class="rn">${esc(p.last)} ${esc(p.first)}${o&&o!==g?`<em>in ${GCOL[o.col].n}</em>`:''}</span><span class="rbtns">${ROLES3.map(r=>`<button class="rb rb-${r}${d===r?' def':''}" data-act="gaddR" data-id="${p.id}" data-v="${r}" aria-label="${esc(p.last)} als ${POS[r]} hinzufügen">${POSK[r]}</button>`).join('')}</span></div>`};
  $('#gaddl').innerHTML=`<div class="small muted">Bei jedem Spieler antippen, als was er heute spielt. Damit ist er gleich in der Gruppe.</div>`+(inThis.length?`<div class="sub">In dieser Gruppe (${inThis.length}) · antippen zum Entfernen</div><div class="inchips">${inThis.map(p=>`<button class="inchip" data-act="gtog" data-id="${p.id}">${esc(p.last)} ${rbadge(trRole(t,p.id))}<span aria-hidden="true">✕</span></button>`).join('')}</div>`:'')+
    `<div class="sub">Noch nicht eingeteilt (${free.length})</div>`+(free.map(row).join('')||'<div class="small muted">Alle sind eingeteilt.</div>')+
    (other.length?(sheetCtx.all?`<div class="sub">In anderen Gruppen</div>`+other.map(row).join(''):'')+`<button class="linkbtn pickall" data-act="gaddAll">${sheetCtx.all?'Andere Gruppen ausblenden':`Spieler aus anderen Gruppen zeigen (${other.length})`}</button>`:'');
}

Object.assign(A,BOARD_ACTIONS,MOB_ACTIONS);
Object.assign(A,SET_ACTIONS);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.smlink){const g=CG();if(g){const v=el.value;if(v==='auto')delete g.sm;else g.sm=v==='none'?null:v;save();render()}return}
  if(el.dataset.bind){const[o,k]=el.dataset.bind.split('.');const obj=o==='game'?CG():CT();if(obj){obj[k]=el.value;save()}}
  if(el.dataset.bname){const bb=BD(el.dataset.bname);if(bb){bb.name=el.value;save()}}
  if(el.dataset.live==='pick'&&sheetCtx){sheetCtx.q=el.value;$('#pickl').innerHTML=pickerList(sheetCtx.k)}
  if(el.dataset.num){const v=el.value.replace(/\D/g,'').slice(0,3);if(v!==el.value)el.value=v;const pl=P(el.dataset.num);if(pl){pl.num=v;save()}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.cat!=null){const i=+el.dataset.cat,old=S.cats[i],v=el.value.trim();
    if(!v||(v!==old&&S.cats.includes(v))){el.value=old;toast(v?'Diese Kategorie gibt es schon.':'Der Name darf nicht leer sein.');return}
    S.cats[i]=v;S.drills.forEach(d=>{if(d.cat===old)d.cat=v});if(U.dcat===old)U.dcat=v;save();render()}
});
boot();
})();
</script>
