<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gunners Kabine TV</title>
<link rel="icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with four tabs (Spieler, Spiel, Training, TV); phone-first lists and lineup slots; the TV tab renders a fixed 1920x1080 stage scaled to fit. Single black/yellow Gunners look, same as the Shot Map. */
:root{
  --bg:#0e0f11; --surface:#17181b; --surface-2:#212226; --line:#2d2e33;
  --fg:#f1efe8; --muted:#a09e96; --accent:#f5c518; --on-accent:#141208;
  --danger:#ef5b5f; --ok:#34c77b; --stage:#0a0b0d;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:1}
option{background:var(--surface);color:var(--fg)}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:34px;width:auto}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--surface-2);color:var(--fg)}
.tab.tv[aria-current="true"]{background:var(--accent);color:var(--on-accent)}

main{max-width:1040px;margin:0 auto;padding-block:16px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
h2{font-family:var(--display);font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--display);font-size:18px;margin:0;font-weight:600;letter-spacing:.02em}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.chip{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.chip.ex{border:1px dashed var(--muted);background:transparent}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:7px;color:var(--muted);font-weight:500;min-width:40px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.seg.acc button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper b{font-family:var(--display);font-size:20px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;line-height:1}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:12px;color:var(--muted)}
.field .seg{display:flex;flex-wrap:nowrap}
.field .seg button{flex:1;padding:7px 6px}
.field textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px;resize:vertical;line-height:1.45}
.field input,.field select{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{min-width:0}
/* iOS: Datum und Uhrzeit nicht breiter als das Feld, Text links wie bei den anderen Feldern */
.field input[type=date],.field input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:44px;line-height:1.4;text-align:left}
.field input::-webkit-date-and-time-value{text-align:left;margin:0}
@media (max-width:600px){.fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fields>.wide{grid-column:1/-1}.fields .seg{width:100%}.fields .seg button{flex:1}}

/* Fotos */
.ph{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.ini{display:grid;place-items:center;width:100%;height:100%;background:var(--surface-2);color:var(--muted);font-family:var(--display);font-weight:700;letter-spacing:.04em}

/* Spielerliste */
.plist{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px}
.pbtn{width:52px;height:65px;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--surface-2);position:relative;flex:none}
.pbtn .ini{font-size:18px}
.pbtn .cam{position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.pbtn .cam svg{width:11px;height:11px}
.prow.target .pbtn{outline:2px dashed var(--accent);outline-offset:2px}
.pname{min-width:0}
.pname b{display:block;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.pname small{color:var(--muted);font-size:12px}
.posseg button{min-width:30px;padding:6px 7px;font-family:var(--display);font-weight:700;letter-spacing:.04em}
.icon{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.icon svg{width:16px;height:16px}
.tray{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tray button{flex:none;width:64px;height:80px;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface-2)}
.tray button[aria-pressed="true"]{border-color:var(--accent)}

/* Lineup */
.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.line.pair{grid-template-columns:34px repeat(2,minmax(0,1fr))}
.lnum{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
.lnum small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px 8px;display:grid;justify-items:center;gap:5px;min-width:0;text-align:center}
.slot:hover{background:var(--surface-2)}
.slot .sp{width:60px;height:75px;border-radius:8px;overflow:hidden}
.slot .sp .ini{font-size:16px}
.slot .sl{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.slot .sn{font-size:13px;line-height:1.2;font-weight:500;width:100%;overflow-wrap:anywhere}
.slot .sn small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.slot.empty{border-style:dashed;background:transparent}
.slot.empty .sp{display:grid;place-items:center;border:1px dashed var(--line);color:var(--muted);font-size:22px}
.secthead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench span{font-size:13px;background:var(--surface-2);border-radius:999px;padding:3px 10px;color:var(--muted)}

/* Training */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grp{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.grp-h{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 4px;}
.grp-c{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border:0;border-radius:8px;background:transparent;color:inherit;text-align:left;font:inherit;letter-spacing:inherit;text-transform:inherit}
.grp-c:hover{background:rgba(0,0,0,.12)}
.grp-mv{display:flex;gap:4px;flex:none}
.grp-mv button{width:32px;height:32px;border-radius:8px;border:0;background:rgba(0,0,0,.16);color:inherit;display:grid;place-items:center;padding:0}
.grp-mv svg{width:14px;height:14px}
@media (max-width:519px){.grp-mv svg{transform:rotate(90deg)}}
.grp-x{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.grp-b{display:grid;gap:6px;padding:10px}
.mini{display:flex;align-items:center;gap:8px;border:0;background:var(--surface-2);border-radius:9px;padding:4px 8px 4px 4px;text-align:left;min-width:0;width:100%}
.mini .mp{width:32px;height:40px;border-radius:6px;overflow:hidden;flex:none}
.mini .mp .ini{font-size:12px}
.mini span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mini i{font-style:normal;margin-left:auto;font-family:var(--display);font-weight:700;font-size:12px;color:var(--muted)}

/* TV */
.tvctl{display:grid;gap:14px}
.tvstat{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.dotlive{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px rgba(52,199,123,.18)}
.dotlive.pin{background:var(--accent);box-shadow:0 0 0 4px rgba(245,197,24,.18)}
.checks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.check{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.check i{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.check[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] i::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg)}
.check small{flex-basis:100%;padding-left:30px;color:var(--muted);font-size:12px}
.tvfoot{position:absolute;left:72px;right:72px;bottom:22px;display:flex;align-items:center;gap:22px}
.tvdots{display:flex;gap:10px}
.tvdots i{width:14px;height:14px;border-radius:50%;background:#33343a}
.tvdots i.on{background:var(--accent)}
.tvbar{flex:1;height:5px;border-radius:3px;background:#1e1f23;overflow:hidden}
.tvbar b{display:block;height:100%;width:100%;background:rgba(245,197,24,.55);transform-origin:0 50%;animation:prog linear forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stage.fade{animation:fadein .6s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stage.fade{animation:none}.tvbar b{animation:none}}
.stagewrap{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
.stagewrap:fullscreen{border:0;border-radius:0;background:#000}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--stage);color:var(--fg);overflow:hidden;padding:52px 72px 56px;display:flex;flex-direction:column;gap:26px}
.stage .ring{position:absolute;right:-260px;top:-260px;width:820px;height:820px;border-radius:50%;border:10px solid rgba(245,197,24,.05);pointer-events:none}
.stage .ring.b{right:-120px;top:-120px;width:540px;height:540px;border-width:4px}
.tvh{position:relative;display:flex;align-items:center;gap:34px;flex:none}
.tvh img{height:128px;width:auto}
.tvh .e{font-family:var(--display);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-size:30px;line-height:1}
.tvh .t{font-family:var(--display);font-weight:700;font-size:86px;line-height:.95;text-transform:uppercase;margin-top:6px;white-space:nowrap}
.tvh .t em{font-style:normal;color:var(--accent);padding-inline:.18em;font-size:.6em;vertical-align:.2em}
.tvh .m{color:var(--muted);font-size:28px;margin-top:6px}
.tvh .r{margin-left:auto;text-align:right;font-family:var(--display);font-weight:700;color:var(--muted);font-size:26px;letter-spacing:.08em;text-transform:uppercase;align-self:flex-start}
.tvb{position:relative;flex:1;min-height:0;display:grid;gap:44px}
.tvcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.tvcol h4{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1}
.tvrows{display:grid;gap:18px;align-content:start}
.tvrow{display:grid;gap:16px;height:var(--h);align-items:stretch}
.tvn{font-family:var(--display);font-weight:700;color:var(--accent);font-size:calc(var(--h) * .42);line-height:1;display:grid;place-items:center}
.tvn.g{font-size:calc(var(--h) * .3)}
.pc{display:flex;background:#16171a;border:1px solid #26272c;border-radius:16px;overflow:hidden;min-width:0;height:100%}
.pc .pp{width:var(--p);height:100%;flex:none;background:#202126}
.pc .pp .ini{font-size:calc(var(--p) * .3)}
.pc .pt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 18px 0 20px;gap:4px}
.pc .pos{font-family:var(--display);font-weight:700;color:var(--accent);letter-spacing:.12em;font-size:calc(var(--h) * .12);line-height:1}
.pc .ln{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:calc(var(--h) * .2);line-height:1;white-space:nowrap}
.pc .fn{color:#b5b3ab;font-size:calc(var(--h) * .13);line-height:1.1;white-space:nowrap}
.pc.empty{background:transparent;border:2px dashed #2a2b30}
.pc.empty .pp{background:transparent}
.pc.dim{opacity:.72}
.tvgroups{position:relative;flex:1;min-height:0;display:grid;gap:26px;align-items:start}
.tg{display:flex;flex-direction:column;gap:14px;min-width:0}
.tg-h{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.08em;text-transform:uppercase}
.tg-h small{font-size:26px;opacity:.75;letter-spacing:.04em}
.tg-b{display:grid;gap:12px}
.tc{display:flex;align-items:center;gap:min(16px,calc(var(--tw,600px) * .035));background:#16171a;border:1px solid #26272c;border-radius:12px;overflow:hidden;height:var(--th);min-width:0}
.tc .pp{width:min(calc(var(--th) * .8),calc(var(--tw,600px) * .24));height:100%;flex:none;background:#202126}
.tc .pp .ini{font-size:calc(var(--th) * .26)}
.tc .tt{min-width:0;padding-right:min(14px,calc(var(--tw,600px) * .03))}
.tc .tnr{flex:none;width:1.25em;text-align:center;font-family:var(--display);font-weight:700;color:var(--accent);font-size:min(calc(var(--th) * .4),calc(var(--tw,600px) * .13));line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-left:calc(min(var(--th),var(--tw,600px) * .3) * -.06)}
.tc .ln{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:min(calc(var(--th) * .3),calc(var(--tw,600px) * .1));line-height:1;white-space:nowrap}
.tc .fn{color:#b5b3ab;font-size:min(calc(var(--th) * .19),calc(var(--tw,600px) * .065));white-space:nowrap;margin-top:2px}
.tvempty{color:#6e6c66;font-size:30px;padding:20px 4px}

/* Sheet */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pick{display:grid;gap:6px}
.pick .mini{padding:6px 10px 6px 6px}
.pick .mini .mp{width:40px;height:50px}
.pick .mini[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.pick .mini em{font-style:normal;margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.pick .sub{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.crop{position:relative;width:min(300px,78vw);aspect-ratio:4/5;max-width:100%;margin:0 auto;border-radius:12px;overflow:hidden;touch-action:none;cursor:grab;background:#000}
.crop canvas{display:block;width:100%;height:100%}
.crop::after{content:"";position:absolute;left:22%;right:22%;top:12%;height:52%;border:2px dashed rgba(255,255,255,.35);border-radius:50%;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.brow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.brow .bt{width:52px;height:65px;border-radius:8px;overflow:hidden}
.brow small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:56px;height:56px;border-radius:12px;border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:12px}
.swatches button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center}
/* Archiv, Goalies, Leerzustand */
.linkbtn{border:0;background:transparent;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.linkbtn:hover{color:var(--fg)}
.chip.tv{background:var(--accent);color:var(--on-accent)}
.chip.game{background:rgba(215,38,61,.2);color:#f39aa5}
.chip.tr{background:rgba(31,95,209,.25);color:#9dbbf2}
.empty{display:grid;gap:10px;justify-items:start;padding:22px}
.alist{display:grid;gap:6px}
.alist h3{margin-bottom:2px}
.arow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.arow:hover{background:var(--surface-2)}
.adate{text-align:center;line-height:1;font-family:var(--display)}

function smooth(pts){
  if(pts.length<3)return 'M'+pts.map(p=>p[0]+' '+p[1]).join(' L');
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`}
  return d;
}

function migrate(s){
  if(s.v===3){if(!s.drills)s.drills=stdDrills();if(!Array.isArray(s.boards))s.boards=[];if(!Array.isArray(s.cats))s.cats=CATS.slice();s.drills.forEach(d=>{if(!s.cats.includes(d.cat))s.cats.push(d.cat)});fixTvc(s);fixPP(s);addRoster2(s);return s}
  if(s.v!==2){
    const isG=id=>(s.players.find(p=>p.id===id)||{}).pos==='G';
    const g=Object.assign(newGame(),s.game||{},{id:'s'+uid()});
    const t=Object.assign(newTraining(),s.training||{},{id:'t'+uid(),gk:{}});
    t.groups.forEach(x=>{x.ids.filter(isG).forEach(id=>t.gk[id]=x.col);x.ids=x.ids.filter(id=>!isG(id))});
    s={v:2,players:s.players,games:[g],trainings:[t],curGame:g.id,curTraining:t.id,tray:s.tray||[],tvc:s.tvc||{}};
  }
  s.games.forEach(g=>{if(!g.pp)g.pp=[PPU(),PPU()];if(!g.pk)g.pk=[PKU(),PKU()]});
  fixPP(s);
  s.trainings.forEach(t=>{if(!t.gks){t.gks=Object.keys(t.gk||{}).filter(id=>t.gk[id]&&t.gk[id]!=='out')}delete t.gk;if(!t.drills)t.drills=[];if(t.topic==null)t.topic=''});
  s.drills=s.drills||stdDrills();if(!Array.isArray(s.boards))s.boards=[];
  if(!s.cats)s.cats=CATS.slice();s.drills.forEach(d=>{if(!s.cats.includes(d.cat))s.cats.push(d.cat)});
  fixTvc(s);
  s.v=3;addRoster2(s);return s;
}

    const h=col.c?`<div class="tg-h" style="background:${col.c.c};color:${col.c.t}"><span>${col.c.n}</span><small>${n}</small></div>`:`<div class="tg-h gkcol"><span>Goalies</span><small>${n}</small></div>`;
    return `<div class="tg" style="--d:${(cols.indexOf(col)*.35+.15).toFixed(2)}s">${h}<div class="tg-b">${col.gk.map(p=>tcard(p,true)).join('')}${col.ids.map(id=>tcard(P(id),false,trRole(t,id))).join('')||(col.gk.length?'':'<div class="tvempty">Noch niemand eingeteilt</div>')}</div></div>`}).join('')}</div>`;
}
function tvDrill(t,i){
  const d=DR(t.drills[i]);if(!d)return trHead(t,'Training · Übungen');
  const n=t.drills.length;let start=0;for(let k=0;k<i;k++)start+=(DR(t.drills[k])||{}).min||0;
  const from=t.time?endTime(t.time,start):'',to=t.time?endTime(t.time,start+d.min):'';
  return `<div class="ring"></div><div class="ring b"></div>
  <div class="tvh"><img src="${LOGO}" alt=""><div style="min-width:0"><div class="e">Training · Übung ${i+1} von ${n}</div><div class="t fit">${esc(d.name)}</div><div class="m">${esc(d.cat)} · ${d.min} Minuten${from?` · ${from}–${to} Uhr`:''}</div></div></div>
  <div class="tvdrill"><div class="tdi">${dimg(d)?`<img src="${dimg(d)}" alt=""${d.photo?' class="foto"':''}>`:''}</div>
  <div class="tdt"><div class="tdh">So geht's</div><p class="tdd">${esc(d.desc||'Keine Beschreibung hinterlegt.')}</p>
  ${d.diag?'<div class="tdleg"><span><i class="lx">X</i>eigene Spieler</span><span><i class="lo">O</i>Gegenspieler</span><span><i class="lg">G</i>Goalie</span><span><b class="ls"></b>laufen</span><span><b class="lp"></b>Pass</span><span><b class="lsh"></b>Schuss</span></div>':''}
  ${i+1<n?`<div class="tdnext">Danach: ${esc((DR(t.drills[i+1])||{}).name||'')}</div>`:''}</div></div>`;
}
function layoutStage(e,s){
  const st=$('#stage');if(!st)return;
  if(e===undefined){e=tvEvent();s=curSlide()}
  const avail=1080-52-56-26-148;
  if(e&&s&&e.k==='game'){
    const g=e.x,R=1.25+0.4;let cw;
    if(s.k==='lines'){
      const nB=Math.max(g.lines.length,g.pairs.length,1),bw=(1776-(nB-1)*30)/nB;
      const cwW=(bw-2*12)/3,cwH=(avail-34*2-12*3-20)/(3*R);
      cw=Math.min(cwW,cwH,230);
    }else if(s.k==='pp'){
      const n=Math.max(1,g.pp.length),rh=Math.min(avail-48,((1776-(n-1)*140)/n)*80/85);
      st.style.setProperty('--rh',Math.floor(rh)+'px');cw=rh*.172;
    }else{
      const n=Math.max(1,g.pk.length),cols=4;
      cw=Math.min((1776-130-(cols-1)*16)/cols,(avail-(n-1)*22)/(n*R),260);
    }
    st.style.setProperty('--cw',Math.floor(cw)+'px');
  }else if(e&&s&&s.k==='groups'){
    const t=e.x,cols=tvCols(t),n=cols.length,colW=(1776-(n-1)*26)/n,cc=colW>=520?2:1;
    const maxK=Math.max(1,...cols.map(c=>c.gk.length+c.ids.length)),r=Math.ceil(maxK/cc);
    const th=Math.max(44,Math.min(132,(avail-96-(r-1)*12)/r));
    st.style.setProperty('--th',th+'px');st.style.setProperty('--tw',Math.floor(cc>1?(colW-12)/2:colW)+'px');
    st.querySelectorAll('.tg-b').forEach((b,i)=>b.style.gridTemplateColumns=`repeat(${cols[i]&&!cols[i].c?1:cc},minmax(0,1fr))`);
  }else if(s&&s.drill){
    const p=st.querySelector('.tdd');if(p){p.style.fontSize='';let fs=parseFloat(getComputedStyle(p).fontSize),i=0;const box=st.querySelector('.tdt');while(box.scrollHeight>box.clientHeight+1&&fs>22&&i<40){fs-=1;p.style.fontSize=fs+'px';i++}}
  }
  st.querySelectorAll('.fit').forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize),i=0;while(el.scrollWidth>el.clientWidth+1&&fs>10&&i<60){fs-=1;el.style.fontSize=fs+'px';i++}});
  fitStage();
}
function fitStage(){
  const w=$('#stagewrap'),st=$('#stage');if(!w||!st)return;
  const fs=document.fullscreenElement===w;
  const W=fs?innerWidth:w.clientWidth,H=fs?innerHeight:Infinity;
  const s=Math.min(W/1920,H/1080);
  st.style.transform=`scale(${s})`;
  if(fs){w.style.height='';st.style.left=(W-1920*s)/2+'px';st.style.top=(innerHeight-1080*s)/2+'px'}
  else{w.style.height=1080*s+'px';st.style.left='0';st.style.top='0'}
}
addEventListener('resize',fitStage);
document.addEventListener('fullscreenchange',fitStage);

/* ---------- TV-Seite ---------- */
U.tab='tv';
// Welche Kabine der Fernseher zeigt, entscheidet der TV-Login (oder ?team=… in der Adresse)
const LASTTEAM='gunners-kabine-tv-team';
if(!TEAM_PARAM){try{const t=localStorage.getItem(LASTTEAM);if(t&&/^[a-z0-9-]{1,20}$/.test(t))TEAM=t}catch(e){}}
const cacheKey=()=>'gunners-kabine-tv-cache'+(TEAM==='km'?'':'-'+TEAM);
function save(){}
function toast(){}
function render(){renderStage(true)}
function fitStage(){
  const st=$('#stage');if(!st)return;
  const W=innerWidth,H=innerHeight,s=Math.min(W/1920,H/1080);
  st.style.transform=`scale(${s})`;st.style.left=(W-1920*s)/2+'px';st.style.top=(H-1080*s)/2+'px';
}
let smT=null,rT=null,cT=null,chan=null,lastSig='',lastOk=0;
function rerender(){clearTimeout(rT);rT=setTimeout(()=>renderStage(false),300)}
function saveCache(){clearTimeout(cT);cT=setTimeout(()=>{try{localStorage.setItem(cacheKey(),JSON.stringify({rows:[...synced].map(([key,j])=>({key,data:JSON.parse(j)})),ext:{kasse:EXT.kasse,sm:EXT.sm},at:Date.now()}))}catch(e){}},1000)}
const sig=()=>{const e=tvEvent(),s=curSlide();return (e?e.k+':'+e.x.id:'')+'|'+(s?s.k:'')+'|'+pinActive()};
function net(ok){
  const n=$('#netst');if(ok){lastOk=Date.now();n.hidden=true;return}
  n.hidden=false;n.textContent=lastOk?'Offline · zeige den Stand von '+hhmm(lastOk)+' Uhr':'Offline · keine Verbindung zum Server';
}
function tvGate(kind,msg){
  const g=$('#gate');g.hidden=false;
  const logo=`<img class="glogo" src="${LOGO}" alt="EC Gunners Zirl">`;
  const H={
    setup:`${logo}<h2>Noch nicht verbunden</h2><p class="muted">Die Anmeldung konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.</p>`,
    login:`${logo}<h2>Kabinen-TV${TEAM_PARAM&&TEAM!=='km'?' · '+esc(TEAMNAME):''}</h2><p class="muted">Einmal mit dem TV-Login anmelden. Danach bleibt der Fernseher angemeldet.</p>
      <form id="tf" class="gform"><label class="field"><span>E-Mail</span><input id="t-mail" type="email" autocomplete="username" required></label>
      <label class="field"><span>Passwort</span><input id="t-pw" type="password" autocomplete="current-password" required></label>
      <div class="gerr" id="t-err" role="alert">${esc(msg||'')}</div><button class="btn primary" type="submit">Anmelden</button></form>`,
    wait:`${logo}<h2>Fast fertig</h2><p class="muted">Dieser Fernseher ist angemeldet. Jetzt auf der Gunners Startseite unter Personen und Rechte beim Login <b>${esc(USER&&USER.email||'')}</b> in der Kabine der Mannschaft „Nur TV-Gerät“ wählen und freischalten. Der Fernseher startet dann von selbst.</p><button class="btn" id="t-out">Abmelden</button>`,
    noteam:`${logo}<h2>Mannschaft nicht gefunden</h2><p class="muted">Die Mannschaft „${esc(TEAM)}“ aus der Adresse gibt es nicht. Prüfe die Adresse am Ende (…/tv/?team=…).</p>`,
    nope:`${logo}<h2>Kein Zugriff</h2><p class="muted">Dieser Login ist für die Kabine nicht freigegeben oder wurde gesperrt. Auf der Gunners Startseite unter Personen und Rechte beim TV-Login in der Kabine der Mannschaft „Nur TV-Gerät“ wählen.</p><button class="btn" id="t-out">Abmelden</button>`
  };
  g.innerHTML=`<div class="gcard">${H[kind]}</div>`;
  const o=$('#t-out');if(o)o.onclick=async()=>{try{await sb.auth.signOut()}catch(e){}location.reload()};
  const f=g.querySelector('input');if(f)setTimeout(()=>f.focus(),30);
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='tf')return;e.preventDefault();
  const b=e.target.querySelector('button');b.disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('#t-mail').value.trim(),password:$('#t-pw').value});
  b.disabled=false;if(error){$('#t-err').textContent=loginMsg(error);return}
  start(data.user);
});
async function refresh(force){
  try{const rows=await fetchDocs();net(true);if(!force&&rowsSig(rows)===syncedSig())return true;loadDocs(rows);saveCache();lastSig=sig();renderStage(false);return true}
  catch(e){net(false);return false}
}
function subscribe(uid){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('kb-tv')
    .on('postgres_changes',{event:'*',schema:'public',table:'kb_docs'},pl=>onDocChange(pl,()=>{saveCache();rerender()}))
    .on('postgres_changes',{event:'*',schema:'public',table:'sm_games'},()=>{clearTimeout(smT);smT=setTimeout(()=>loadExt().then(ch=>{if(ch){saveCache();rerender()}}),700)})
    .on('postgres_changes',{event:'*',schema:'public',table:'g_access',filter:'user_id=eq.'+uid},pl=>{const m=pl.new||{};if(pl.eventType==='DELETE'||!tvOk(m))location.reload();else refresh()})
    .subscribe(st=>{if(st==='SUBSCRIBED'){net(true)}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')net(false)});
}
let USER=null,waitT=null;
const rightFor=(a,t)=>!a||a.status!=='ok'?null:a.is_admin?'admin':t==='km'?a.kabine||null:((a.teams||{})[t]||null);
const tvOk=a=>!!rightFor(a,TEAM);
function pickTeam(a){
  if(TEAM_PARAM||!a||a.status!=='ok')return;
  const tvT=(a.kabine==='tv'?['km']:[]).concat(Object.keys(a.teams||{}).filter(k=>a.teams[k]==='tv'));
  let t=TEAM;
  if(tvT.length===1)t=tvT[0];else if(!rightFor(a,t))t=tvT[0]||(a.kabine?'km':Object.keys(a.teams||{})[0])||'km';
  if(t!==TEAM){TEAM=t;loadDocs([]);EXT.kasse=null;EXT.sm=[];renderStage(false)}
  try{localStorage.setItem(LASTTEAM,TEAM)}catch(e){}
}
async function start(user){
  USER=user;
  const {data:mem,error}=await sb.from('g_access').select('*').eq('user_id',user.id).maybeSingle();
  if(error){net(false);setTimeout(()=>start(user),30000);return}
  // Neuer TV-Login: meldet sich selbst an und wartet, bis der Admin ihn einer Kabine zuordnet
  if(!mem||mem.status==='wait'){
    if(!mem)await sb.from('g_access').insert({user_id:user.id,email:user.email,name:'Fernseher ('+user.email+')',status:'wait'});
    tvGate('wait');clearTimeout(waitT);waitT=setTimeout(()=>start(user),15000);return}
  pickTeam(mem);
  if(!tvOk(mem)){tvGate('nope');return}
  if(!(await loadTeamName())){tvGate('noteam');return}
  $('#gate').hidden=true;
  await loadExt();await refresh(true);subscribe(user.id);
}
async function tvBoot(){
  fitStage();
  try{const c=JSON.parse(localStorage.getItem(cacheKey()));if(c&&Array.isArray(c.rows)){if(c.ext){EXT.kasse=c.ext.kasse||null;EXT.sm=c.ext.sm||[]}loadDocs(c.rows);lastOk=c.at||0;renderStage(false)}}catch(e){}
  if(!configured()||!window.supabase){tvGate('setup');return}
  sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'gunners-kabine-tv-auth'}});
  const {data}=await sb.auth.getSession();
  if(!data.session){tvGate('login');return}
  start(data.session.user);
}
setInterval(()=>{const s=sig();if(s!==lastSig){lastSig=s;renderStage(true)}},30000);
setInterval(()=>{if(USER)refresh()},30000);
setInterval(()=>{if(USER)loadExt().then(ch=>{if(ch){saveCache();rerender()}})},60000);
document.addEventListener('visibilitychange',()=>{if(USER&&document.visibilityState==='visible')refresh()});
addEventListener('online',()=>{if(USER){refresh();subscribe(USER.id)}});
addEventListener('offline',()=>net(false));
addEventListener('resize',fitStage);
// Bildschirm wach halten
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')lock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',wake);wake();

let idleT=null;
function wakeUi(){document.body.classList.add('active');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.remove('active'),3000)}
['mousemove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wakeUi));
$('#fsbtn').onclick=()=>{const d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(e){}};

  const n=$('#pinnote');if(!n)return;const c=tvc(),e=tvEvent();
  if(!USER||!e||!pinActive()||slidesFor(e).some(x=>x.k===c.pin)){n.hidden=true;return}
  const why=c.pin==='shotmap'?smNote(e):c.pin==='kasse'?kasseNote():'';

setInterval(pinNote,3000);
// Neue Version auf GitHub: der Fernseher lädt sich von selbst neu (alle 5 Minuten prüfen)
const BUILD='aa9cb1b210';
async function checkVersion(){
  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/const BUILD='([0-9a-f]{10})'/);if(m&&m[1]!==BUILD)location.reload()}catch(e){}
}
setInterval(checkVersion,5*60000);
tvBoot();
