<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gunners App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gunners">
<meta name="theme-color" content="#0e0f11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: start screen with one large tile per app, admin area below; single black/yellow Gunners look like the three apps. */
:root{
  --bg:#0e0f11; --surface:#17181b; --surface-2:#212226; --line:#2d2e33;
  --fg:#f1efe8; --muted:#a09e96; --accent:#f5c518; --on-accent:#141208;
  --danger:#ef5b5f; --ok:#34c77b; --blue:#8fb0f2;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:42px;width:auto}
.brand b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px}
main{max-width:980px;margin:0 auto;padding-block:20px 60px;display:grid;gap:22px}
h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
h3{font-family:var(--display);font-size:20px;margin:0;font-weight:600;letter-spacing:.02em}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:transparent;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.linkbtn:hover{color:var(--fg)}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.banner{border:1px solid var(--accent);background:rgba(245,197,24,.08);border-radius:12px;padding:10px 14px;font-size:14px}
.chip{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.chip.wait{border:1px solid var(--accent);background:transparent;color:var(--accent)}
.chip.off{border:1px solid var(--danger);background:transparent;color:var(--danger)}

/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:200px;padding:20px 22px;border-radius:20px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tile:hover{border-color:#4a4b52}
.tile .ic{margin-bottom:auto;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2)}
.tile .ic svg{width:30px;height:30px}
.tile b{font-family:var(--display);font-weight:700;font-size:clamp(24px,6.6vw,29px);line-height:1;text-transform:uppercase;letter-spacing:.02em}
.tile small{color:var(--muted);font-size:14px;max-width:30ch}
.tile .role{position:absolute;right:18px;top:20px}
.tile.k{background:linear-gradient(160deg,#2a2410 0%,var(--surface) 55%)}
.tile.k .ic{background:var(--accent);color:var(--on-accent)}
.tile.s .ic{color:#ff8a8d}.tile.c .ic{color:var(--ok)}.tile.t .ic{color:var(--blue)}
.tile.t{min-height:120px}
@media (max-width:600px){.tile{min-height:150px}}

/* Rechte */
.adm{display:grid;gap:12px}
.adm-h{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.legend{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600}
.plist{display:grid;gap:8px}
.prs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.prs.w{border-color:rgba(245,197,24,.5)}
.av{width:42px;height:42px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted)}
.pi{min-width:0}.pi b{font-weight:600}.pi small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.rights{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rights label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.rights select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;color:var(--fg)}
.rights select.on{border-color:var(--accent)}
.admt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
.admt input{width:20px;height:20px;accent-color:var(--accent)}
.pact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.sec{display:grid;gap:8px}

/* Anmelden */
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;overflow:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gcard{width:100%;max-width:400px;display:grid;gap:14px;text-align:center}
.glogo{height:120px;width:auto;margin:0 auto}
.gcard h2{font-size:34px}
.gform{display:grid;gap:12px;text-align:left}
.field{display:grid;gap:4px}
.field span{font-size:12px;color:var(--muted)}
.field input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
.gform .btn{justify-content:center;padding:12px}
.gerr{color:var(--danger);font-size:14px;min-height:1.2em}
.gok{color:var(--ok)}
.glinks{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.gcard .btn{justify-self:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (min-width:760px){.prs{grid-template-columns:auto minmax(0,1fr) auto}.pact{grid-column:auto}}
</style>

    ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>'},
  kasse:{n:'Mannschaftskasse',d:'Strafen, Beiträge, Getränke und Rangliste',href:'kasse/',cls:'c',opts:[['','Kein Zugriff'],['edit','Verwalten']],
    ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>'}
};
const RN={view:'Ansehen',edit:'Bearbeiten',tv:'TV-Gerät',admin:'Admin'};
const appRole=(a,k)=>!a||a.status!=='ok'?null:a.is_admin?'admin':a[k]||null;
const pname=r=>r.name||String(r.email||'').split('@')[0]||'Ohne Namen';
const ini=r=>pname(r).replace(/[^\p{L}\s._-]/gu,'').split(/[ ._-]/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
const errMsg=e=>{const m=(e&&e.message)||'';
  if(/invalid login/i.test(m))return'E-Mail oder Passwort stimmt nicht.';
  if(/not confirmed/i.test(m))return'Die E-Mail-Adresse ist noch nicht bestätigt. Schau in dein Postfach.';
  if(/already registered|already exists/i.test(m))return'Mit dieser E-Mail gibt es schon einen Login. Melde dich einfach an.';
  if(/password/i.test(m)&&/6/.test(m))return'Das Passwort braucht mindestens 6 Zeichen.';
  if(/fetch|network/i.test(m))return'Keine Verbindung. Prüfe das Internet und versuche es nochmal.';
  if(/eigenen Zugang/.test(m))return'Deinen eigenen Zugang kannst du nicht ändern.';
  return m||'Das hat nicht geklappt. Bitte nochmal versuchen.'};

/* ---------- Anmeldung ---------- */
function gate(kind,msg){
  const g=$('#gate');g.hidden=false;
  const logo=`<img class="glogo" src="${LOGO}" alt="EC Gunners Zirl">`,out=`<button class="linkbtn" data-act="logout">Abmelden</button>`;
  const H={
    login:`${logo}<h2>Gunners App</h2><p class="muted">Ein Login für Kabine, Shot Map und Kasse.</p>
      <form id="lf" class="gform"><label class="field"><span>E-Mail</span><input id="l-mail" type="email" autocomplete="username" required></label>
      <label class="field"><span>Passwort</span><input id="l-pw" type="password" autocomplete="current-password" required></label>
      <div class="gerr${/^✓/.test(msg||'')?' gok':''}" id="l-err" role="alert">${esc(msg||'')}</div><button class="btn primary" type="submit">Anmelden</button></form>
      <div class="glinks"><button class="linkbtn" data-act="gReg">Neu hier? Registrieren</button><button class="linkbtn" data-act="gForgot">Passwort vergessen</button></div>`,
    reg:`${logo}<h2>Registrieren</h2><p class="muted">Danach schaltet dich der Admin für die passenden Apps frei.</p>
      <form id="rf" class="gform"><label class="field"><span>Name</span><input id="r-name" autocomplete="name" required></label>
      <label class="field"><span>E-Mail</span><input id="r-mail" type="email" autocomplete="username" required></label>
      <label class="field"><span>Passwort (mind. 6 Zeichen)</span><input id="r-pw" type="password" autocomplete="new-password" minlength="6" required></label>
      <div class="gerr" id="r-err" role="alert">${esc(msg||'')}</div><button class="btn primary" type="submit">Registrieren</button></form>
      <div class="glinks"><button class="linkbtn" data-act="gLogin">Ich habe schon einen Login</button></div>`,
    join:`${logo}<h2>Zugang anfragen</h2><p class="muted">Du bist angemeldet. Gib deinen Namen an, damit der Admin weiß, wer du bist.</p>
      <form id="jf" class="gform"><label class="field"><span>Name</span><input id="j-name" autocomplete="name" required value="${esc(msg||'')}"></label><button class="btn primary" type="submit">Zugang anfragen</button></form>${out}`,
    wait:`${logo}<h2>Warte auf Freischaltung</h2><p class="muted">Deine Anfrage ist da. Sobald der Admin dich freischaltet, siehst du hier deine Apps.</p><button class="btn" data-act="gRetry">Nochmal prüfen</button>${out}`,
    off:`${logo}<h2>Zugang gesperrt</h2><p class="muted">Dein Zugang ist gesperrt. Melde dich beim Admin, wenn das ein Versehen ist.</p>${out}`,
    newpw:`${logo}<h2>Neues Passwort</h2><form id="nf" class="gform"><label class="field"><span>Neues Passwort (mind. 6 Zeichen)</span><input id="n-pw" type="password" autocomplete="new-password" minlength="6" required></label><div class="gerr" id="n-err" role="alert"></div><button class="btn primary" type="submit">Speichern</button></form>`,
    err:`${logo}<h2>Keine Verbindung</h2><p class="muted">${esc(msg||'')}</p><button class="btn primary" data-act="gRetry">Nochmal versuchen</button>${out}`,
    load:`${logo}<p class="muted">Lade …</p>`
  };
  g.innerHTML=`<div class="gcard">${H[kind]}</div>`;
  const f=g.querySelector('input');if(f)setTimeout(()=>f.focus(),30);
}
function ungate(){$('#gate').hidden=true}
async function afterLogin(user){
  ME={id:user.id,email:user.email,name:(user.user_metadata&&user.user_metadata.name)||''};
  gate('load');
  const {data,error}=await sb.from('g_access').select('*').eq('user_id',user.id).maybeSingle();
  if(error){gate('err',errMsg(error));return}
  ACC=data;
  if(!ACC){gate('join',ME.name);return}
  if(ACC.status==='wait'){gate('wait');return}
  if(ACC.status==='off'){gate('off');return}
  const want=Q.get('zu');
  if(want&&APPS[want]&&appRole(ACC,want)&&!(want==='kabine'&&ACC.kabine==='tv'&&!ACC.is_admin)){location.replace(APPS[want].href);return}
  if(ACC.is_admin)await loadRows();
  subscribe();ungate();render();
}
async function loadRows(){const {data,error}=await sb.from('g_access').select('*').order('created_at');if(!error)ROWS=data||[]}
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('g-access').on('postgres_changes',{event:'*',schema:'public',table:'g_access'},async pl=>{
    const r=pl.new&&pl.new.user_id?pl.new:pl.old;
    if(r&&r.user_id===ME.id&&pl.eventType!=='DELETE'){ACC=Object.assign({},ACC,pl.new)}
    if(ACC&&ACC.is_admin)await loadRows();
    if(!$('#main').contains(document.activeElement)||document.activeElement.tagName!=='SELECT')render();
  }).subscribe();
}

/* ---------- Ansichten ---------- */
function render(){
  $('#hbtn').innerHTML=`<button class="btn sm" data-act="logout">Abmelden</button>`;
  const first=(ACC.name||ME.name||pname(ACC)).split(' ')[0];
  const kein=Q.get('kein');
  const tiles=['kabine','shotmap','kasse'].map(k=>{const r=appRole(ACC,k),A=APPS[k];if(!r||(k==='kabine'&&r==='tv'))return'';
    return `<a class="tile ${A.cls}" href="${A.href}"><span class="ic">${A.ic}</span>${ACC.is_admin?'':`<span class="role chip">${(A.opts.find(o=>o[0]===r)||[])[1]}</span>`}<b>${A.n}</b><small>${A.d}</small></a>`}).join('');
  const kr=appRole(ACC,'kabine');
  const tv=kr?`<a class="tile t" href="tv/"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M7 21h10"/></svg></span><b>Kabinen-TV</b><small>Für den Fernseher in der Kabine. Am Mini-PC öffnen und mit dem TV-Login anmelden.</small></a>`:'';
  $('#main').innerHTML=`
  <section><div class="eyebrow">Gunners App</div><h2>Servus${first?' '+esc(first):''}!</h2></section>
  ${kein&&APPS[kein]?`<div class="banner">Für <b>${APPS[kein].n}</b> bist du noch nicht freigeschaltet. Frag den Admin.</div>`:''}
  ${tiles||tv?`<section class="tiles">${tiles}${tv}</section>`:'<div class="note">Du bist freigeschaltet, hast aber noch für keine App Rechte. Der Admin trägt sie dir ein.</div>'}
  ${ACC.is_admin?vAdmin():''}`;
}
function sel(r,k){const A=APPS[k],v=r[k]||'';return `<label>${A.n}<select data-r="${k}" data-id="${r.user_id}" class="${v?'on':''}" ${r.is_admin&&k!=='kabine'?'disabled':''}>${A.opts.map(([o,l])=>`<option value="${o}"${o===v?' selected':''}>${l}</option>`).join('')}</select></label>`}
function personRow(r){
  const me=r.user_id===ME.id,w=r.status==='wait';
  const chips=(r.is_admin?'<span class="chip acc">Admin</span> ':'')+(w?'<span class="chip wait">Wartet</span> ':'')+(r.status==='off'?'<span class="chip off">Gesperrt</span> ':'')+(me?'<span class="chip">Du</span>':'');
  const tvOnly=r.kabine==='tv';
  let acts='';
  if(me)acts='<span class="small muted">Deinen eigenen Zugang änderst du hier nicht.</span>';
  else if(w)acts=`<button class="btn primary sm" data-act="ok" data-id="${r.user_id}">Freischalten</button><button class="btn sm danger${arm==='no'+r.user_id?' armed':''}" data-act="no" data-id="${r.user_id}">${arm==='no'+r.user_id?'Wirklich ablehnen?':'Ablehnen'}</button>`;
  else if(r.status==='off')acts=`<button class="btn sm" data-act="on" data-id="${r.user_id}">Wieder freischalten</button><button class="btn sm danger${arm==='del'+r.user_id?' armed':''}" data-act="del" data-id="${r.user_id}">${arm==='del'+r.user_id?'Wirklich löschen?':'Löschen'}</button>`;
  else acts=`${tvOnly?'':`<label class="admt"><input type="checkbox" data-adm="${r.user_id}" ${r.is_admin?'checked':''}> Admin</label>`}<button class="btn sm danger${arm==='off'+r.user_id?' armed':''}" data-act="off" data-id="${r.user_id}">${arm==='off'+r.user_id?'Wirklich sperren?':'Sperren'}</button>`;
  return `<div class="prs${w?' w':''}"><span class="av">${esc(ini(r))}</span><div class="pi"><b>${esc(pname(r))}</b> ${chips}<small>${esc(r.email||'')}</small></div>
  <div class="pact">${acts}</div>${me||r.status==='off'?'':`<div class="rights">${['kabine','shotmap','kasse'].map(k=>sel(r,k)).join('')}</div>`}</div>`;
}
function vAdmin(){
  const w=ROWS.filter(r=>r.status==='wait'),ok=ROWS.filter(r=>r.status==='ok'),off=ROWS.filter(r=>r.status==='off');
  return `<section class="adm" id="rechte"><div class="adm-h"><div><div class="eyebrow">Admin</div><h2>Personen und Rechte</h2></div><button class="btn sm" data-act="reload">Aktualisieren</button></div>
  <div class="legend"><span><b>Kabine:</b> Ansehen = Aufstellung und Training sehen · Bearbeiten = alles planen · Nur TV-Gerät = Login für den Fernseher</span>
  <span><b>Shot Map:</b> Erfassen = Spiele anlegen und Schüsse eintragen</span><span><b>Kasse:</b> Verwalten = Strafen und Zahlungen buchen</span><span><b>Admin:</b> alle Apps und diese Rechteverwaltung</span></div>
  ${w.length?`<div class="sec"><h3>Warten auf Freischaltung (${w.length})</h3><div class="small muted">Rechte wählen, dann freischalten.</div><div class="plist">${w.map(personRow).join('')}</div></div>`:''}
  <div class="sec"><h3>Freigeschaltet (${ok.length})</h3><div class="plist">${ok.map(personRow).join('')}</div></div>
  ${off.length?`<div class="sec"><h3>Gesperrt (${off.length})</h3><div class="plist">${off.map(personRow).join('')}</div></div>`:''}
  <div class="note">Neue Personen registrieren sich selbst über diese Seite und erscheinen dann oben unter „Warten auf Freischaltung“. Den TV-Login legst du in Supabase an (siehe Anleitung) und stellst ihn hier auf „Nur TV-Gerät“.</div></section>`;
}

/* ---------- Aktionen ---------- */
async function upd(id,patch,msg){
  const {error}=await sb.from('g_access').update(patch).eq('user_id',id);
  if(error){toast(errMsg(error));await loadRows();render();return false}
  const r=ROWS.find(x=>x.user_id===id);if(r)Object.assign(r,patch);render();if(msg)toast(msg);return true;
}
const A={
  logout:async()=>{try{await sb.auth.signOut()}catch(e){}location.replace(location.pathname)},
  gReg:()=>gate('reg'),gLogin:()=>gate('login'),
  gForgot:async()=>{const m=$('#l-mail').value.trim();if(!m){$('#l-err').textContent='Trag zuerst deine E-Mail ein, dann nochmal auf „Passwort vergessen“.';return}
    const {error}=await sb.auth.resetPasswordForEmail(m,{redirectTo:location.href.split('#')[0].split('?')[0]});const e=$('#l-err');e.className='gerr'+(error?'':' gok');e.textContent=error?errMsg(error):'Wir haben dir einen Link zum Zurücksetzen geschickt.'},
  gRetry:async()=>{const {data}=await sb.auth.getSession();if(data.session)afterLogin(data.session.user);else gate('login')},
  reload:async()=>{await loadRows();render();toast('Aktualisiert')},
  ok:b=>{const r=ROWS.find(x=>x.user_id===b.dataset.id);upd(r.user_id,{status:'ok'},`${pname(r)} ist freigeschaltet`)},
  no:async b=>{const id=b.dataset.id;if(arm!=='no'+id){arm='no'+id;render();return}arm=null;const {error}=await sb.from('g_access').delete().eq('user_id',id);if(error){toast(errMsg(error));return}ROWS=ROWS.filter(x=>x.user_id!==id);render();toast('Anfrage abgelehnt')},
  off:b=>{const id=b.dataset.id;if(arm!=='off'+id){arm='off'+id;render();return}arm=null;upd(id,{status:'off'},'Zugang gesperrt')},
  on:b=>upd(b.dataset.id,{status:'ok'},'Wieder freigeschaltet'),
  del:async b=>{const id=b.dataset.id;if(arm!=='del'+id){arm='del'+id;render();return}arm=null;const {error}=await sb.from('g_access').delete().eq('user_id',id);if(error){toast(errMsg(error));return}ROWS=ROWS.filter(x=>x.user_id!==id);render();toast('Gelöscht')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();if(arm&&!b.dataset.act.match(/^(no|off|del)$/))arm=null;f(b)}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.r){const v=el.value||null,k=el.dataset.r,id=el.dataset.id,r=ROWS.find(x=>x.user_id===id);
    const patch={[k]:v};if(k==='kabine'&&v==='tv'){patch.shotmap=null;patch.kasse=null;patch.is_admin=false}
    upd(id,patch,`${pname(r)}: ${APPS[k].n} – ${(APPS[k].opts.find(o=>o[0]===(v||''))||[])[1]}`)}
  if(el.dataset.adm){const id=el.dataset.adm,r=ROWS.find(x=>x.user_id===id);upd(id,{is_admin:el.checked},el.checked?`${pname(r)} ist jetzt Admin`:`${pname(r)} ist kein Admin mehr`)}
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(!['lf','rf','jf','nf'].includes(f.id))return;e.preventDefault();
  const btn=f.querySelector('button[type=submit]');btn.disabled=true;
  try{
    if(f.id==='lf'){const {data,error}=await sb.auth.signInWithPassword({email:$('#l-mail').value.trim(),password:$('#l-pw').value});if(error){$('#l-err').className='gerr';$('#l-err').textContent=errMsg(error);return}afterLogin(data.user)}
    if(f.id==='rf'){const name=$('#r-name').value.trim(),email=$('#r-mail').value.trim();const {data,error}=await sb.auth.signUp({email,password:$('#r-pw').value,options:{data:{name}}});
      if(error){$('#r-err').textContent=errMsg(error);return}
      if(!data.session){gate('login','✓ Fast geschafft: Bestätige deine E-Mail über den Link im Postfach und melde dich dann an.');return}
      const r=await sb.from('g_access').insert({user_id:data.user.id,email,name,status:'wait'});if(r.error&&!/duplicate/i.test(r.error.message)){$('#r-err').textContent=errMsg(r.error);return}gate('wait')}
    if(f.id==='jf'){const {data:{user}}=await sb.auth.getUser();const name=$('#j-name').value.trim();const r=await sb.from('g_access').insert({user_id:user.id,email:user.email,name,status:'wait'});if(r.error&&!/duplicate/i.test(r.error.message)){toast(errMsg(r.error));return}gate('wait')}
    if(f.id==='nf'){const {error}=await sb.auth.updateUser({password:$('#n-pw').value});if(error){$('#n-err').textContent=errMsg(error);return}history.replaceState(null,'',location.pathname);const {data}=await sb.auth.getSession();if(data.session)afterLogin(data.session.user);else gate('login')}
  }finally{btn.disabled=false}
});
async function boot(){
  if(!window.supabase){gate('err','Die Anmeldung konnte nicht geladen werden. Prüfe die Verbindung.');return}
  sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')gate('newpw')});
  if(/type=recovery/.test(location.hash))return;
  const {data}=await sb.auth.getSession();
  if(!data.session){gate('login');return}
  afterLogin(data.session.user);
}
boot();
})();
</script>
</html>
